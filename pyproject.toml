[project]
name = "ambisense"
version = "0.1.0"
description = "Signal-detection audit of ambiguity-awareness in tool-calling agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.2,<3",
    "pandas>=2.2.0,<3",
    "numpy>=1.26.4,<3",
    "scipy>=1.13.0,<2",
    "matplotlib>=3.9.0,<4",
    "openai>=1.86.0,<2",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "typer>=0.12.5,<1",
    "ruff>=0.6.0,<1",
]

[project.optional-dependencies]
# Installed separately; do not confuse with the unrelated PyPI package `bfcl`.
bfcl = ["bfcl-eval==2026.3.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]
# C901: McCabe complexity. Hard ceiling of 10 per function.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Catalog rows are data. Scripts load dotenv before local imports.
"src/ambisense/catalog/*.py" = ["E501"]
"scripts/*" = ["E501", "E402"]
"tests/*" = ["E501"]
